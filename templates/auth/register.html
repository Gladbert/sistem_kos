{% extends "base.html" %}
{% block title %}Daftar - Sistem Kos{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card card fade-in" style="max-width:480px">
        <div class="auth-header">
            <div class="auth-icon"><i class="bi bi-person-plus-fill"></i></div>
            <h2>Daftar Akun</h2>
            <p class="text-muted" style="font-size:.875rem">Untuk menyewa kamar kos</p>
        </div>
        <div class="auth-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="register-username">Username*</label>
                        <input type="text" name="username" id="register-username" class="form-control" required autocomplete="username">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="register-email">Email*</label>
                        <input type="email" name="email" id="register-email" class="form-control" required autocomplete="email">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="register-nama">Nama Lengkap*</label>
                    <input type="text" name="nama_lengkap" id="register-nama" class="form-control" required autocomplete="name">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="register-password">Password*</label>
                        <input type="password" name="password" id="register-password" class="form-control" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="register-confirm">Konfirmasi Password*</label>
                        <input type="password" name="confirm_password" id="register-confirm" class="form-control" required autocomplete="new-password">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="register-telepon">No. Telepon</label>
                    <input type="tel" name="no_telepon" id="register-telepon" class="form-control" placeholder="08123456789" autocomplete="tel">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="register-alamat">Alamat</label>
                    <textarea name="alamat" id="register-alamat" class="form-control" rows="2" autocomplete="street-address"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Daftar</button>
            </form>
        </div>
        <div class="auth-footer">
            Sudah punya akun? <a href="{{ url_for('auth.login') }}">Masuk</a>
        </div>
    </div>
</div>
{% endblock %}

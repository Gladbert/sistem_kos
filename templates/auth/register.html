{% extends "base.html" %}
{% block title %}Daftar - Sistem Kos{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card card fade-in" style="max-width:480px">
        <div class="auth-header">
            <div class="auth-icon"><i class="bi bi-person-plus-fill"></i></div>
            <h2>Daftar Akun</h2>
            <p class="text-muted" style="font-size:.875rem">Untuk menyewa kamar kos</p>
        </div>
        <div class="auth-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Username*</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email*</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nama Lengkap*</label>
                    <input type="text" name="nama_lengkap" class="form-control" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password*</label>
                        <input type="password" name="password" class="form-control" required minlength="6">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Konfirmasi Password*</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">No. Telepon</label>
                    <input type="tel" name="no_telepon" class="form-control" placeholder="08123456789">
                </div>
                <div class="mb-3">
                    <label class="form-label">Alamat</label>
                    <textarea name="alamat" class="form-control" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Daftar</button>
            </form>
        </div>
        <div class="auth-footer">
            Sudah punya akun? <a href="{{ url_for('auth.login') }}">Masuk</a>
        </div>
    </div>
</div>
{% endblock %}

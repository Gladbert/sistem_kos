{% extends "base.html" %}
{% block title %}Login - Sistem Kos{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card card fade-in">
        <div class="auth-header">
            <div class="auth-icon"><i class="bi bi-buildings"></i></div>
            <h2>Sistem Kos</h2>
            <p class="text-muted">Manajemen Kos Modern</p>
        </div>
        <div class="auth-body">
            <p class="text-center text-muted mb-3">Pilih mode untuk melanjutkan</p>

            <form method="POST" class="mb-2">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="username" value="admin">
                <input type="hidden" name="password" value="admin123">
                <button type="submit" class="btn btn-primary w-100 py-3">
                    <div class="d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-shield-lock fs-5"></i>
                        <div class="text-start">
                            <div class="fw-bold">Admin</div>
                            <small class="opacity-75">Kelola semua kos & pengaturan</small>
                        </div>
                    </div>
                </button>
            </form>

            <form method="POST" class="mb-2">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="username" value="management">
                <input type="hidden" name="password" value="mgmt123">
                <button type="submit" class="btn btn-secondary w-100 py-3">
                    <div class="d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-gear fs-5"></i>
                        <div class="text-start">
                            <div class="fw-bold">Management</div>
                            <small class="opacity-75">Kelola kamar, pembayaran, maintenance</small>
                        </div>
                    </div>
                </button>
            </form>

            <form method="POST" class="mb-2">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="username" value="budi">
                <input type="hidden" name="password" value="client123">
                <button type="submit" class="btn btn-outline-primary w-100 py-3">
                    <div class="d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-person fs-5"></i>
                        <div class="text-start">
                            <div class="fw-bold">Client</div>
                            <small class="text-muted">Lihat info kamar & pembayaran</small>
                        </div>
                    </div>
                </button>
            </form>

            <div class="divider"><span>atau</span></div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="login-username" class="form-label">Username</label>
                    <input type="text" name="username" id="login-username" class="form-control" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" name="password" id="login-password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-outline-secondary w-100">Login Manual</button>
            </form>
        </div>
    </div>
</div>

<style>
    .divider {
        display: flex;
        align-items: center;
        margin: 1.25rem 0;
        color: var(--gray-400);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--gray-200);
    }
    .divider span {
        padding: 0 0.75rem;
    }
    .btn .opacity-75 { opacity: 0.75; }
</style>
{% endblock %}

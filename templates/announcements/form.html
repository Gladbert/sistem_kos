{% extends "base.html" %}
{% block title %}{{ 'Edit' if announcement else 'Buat' }} Pengumuman - Sistem Kos{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ 'Edit' if announcement else 'Buat' }} Pengumuman</h1>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card border-0">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Judul</label>
                        <input type="text" name="judul" class="form-control" required
                               value="{{ announcement.judul if announcement else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Isi</label>
                        <textarea name="isi" class="form-control" rows="6" required>{{ announcement.isi if announcement else '' }}</textarea>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Prioritas</label>
                            <select name="prioritas" class="form-select">
                                <option value="normal" {% if announcement and announcement.prioritas == 'normal' %}selected{% endif %}>Normal</option>
                                <option value="sedang" {% if announcement and announcement.prioritas == 'sedang' %}selected{% endif %}>Sedang</option>
                                <option value="penting" {% if announcement and announcement.prioritas == 'penting' %}selected{% endif %}>Penting</option>
                            </select>
                        </div>
                        <div class="col-md-6 d-flex align-items-end">
                            <div class="form-check">
                                <input type="checkbox" name="ditampilkan" class="form-check-input" id="ditampilkan"
                                       {% if not announcement or announcement.ditampilkan %}checked{% endif %}>
                                <label class="form-check-label" for="ditampilkan">Tampilkan ke penghuni</label>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>{{ 'Simpan' if announcement else 'Buat' }}
                        </button>
                        <a href="{{ url_for('announcements.index') }}" class="btn btn-outline-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

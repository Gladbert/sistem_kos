{% extends "base.html" %}
{% block title %}Ajukan Komplain - Sistem Kos{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Ajukan Komplain</h1>
    <p>Sampaikan keluhan atau masalah yang Anda alami</p>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card border-0">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Judul</label>
                        <input type="text" name="judul" class="form-control" required
                               placeholder="Contoh: AC rusak, kamar bocor">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kategori</label>
                        <select name="kategori" class="form-select">
                            <option value="umum">Umum</option>
                            <option value="fasilitas">Fasilitas</option>
                            <option value="kebersihan">Kebersihan</option>
                            <option value="keamanan">Keamanan</option>
                            <option value="penghuni">Sesama Penghuni</option>
                            <option value="lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Deskripsi</label>
                        <textarea name="deskripsi" class="form-control" rows="5" required
                                  placeholder="Jelaskan masalah secara detail..."></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send me-1"></i>Kirim
                        </button>
                        <a href="{{ url_for('complaints.index') }}" class="btn btn-outline-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
